<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans', 'Meiryo', sans-serif">

  <rect width="820" height="430" fill="#F7F8FA"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A2E">スマホの登場とエンジニアの広がり</text>

  <!-- CLIENT SIDE -->
  <rect x="20" y="55" width="330" height="300" rx="14" fill="#EAF3FB" stroke="#4A90D9" stroke-width="2"/>
  <text x="185" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C5F8A">クライアント</text>

  <!-- PC フロントエンド -->
  <rect x="34" y="90" width="140" height="250" rx="10" fill="#D0EAFF" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- PC icon -->
  <rect x="48" y="100" width="112" height="76" rx="5" fill="white" stroke="#4A90D9" stroke-width="1.2"/>
  <rect x="48" y="100" width="112" height="16" rx="5" fill="#4A90D9"/>
  <rect x="48" y="108" width="112" height="8" fill="#4A90D9"/>
  <rect x="56" y="124" width="50" height="5" rx="2" fill="#B0CCE8"/>
  <rect x="56" y="134" width="96" height="4" rx="2" fill="#D5E8F5"/>
  <rect x="56" y="143" width="80" height="4" rx="2" fill="#D5E8F5"/>
  <rect x="56" y="155" width="40" height="12" rx="3" fill="#4A90D9"/>
  <text x="76" y="164" text-anchor="middle" font-size="7" fill="white">ボタン</text>
  <text x="104" y="192" text-anchor="middle" font-size="10" fill="#444">ブラウザ</text>
  <text x="104" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A5A9A">フロントエンド</text>
  <text x="104" y="236" text-anchor="middle" font-size="10" fill="#555">ブラウザの中で動く</text>
  <text x="104" y="251" text-anchor="middle" font-size="10" fill="#555">画面の見た目・操作</text>
  <text x="104" y="326" text-anchor="middle" font-size="10" fill="#2C5F8A">PC</text>

  <!-- スマホ iOS Android -->
  <rect x="184" y="90" width="152" height="250" rx="10" fill="#E8F4E8" stroke="#5BA85A" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- iOS -->
  <rect x="192" y="98" width="64" height="110" rx="7" fill="#F0FAF0" stroke="#5BA85A" stroke-width="1.2" stroke-dasharray="4,2"/>
  <!-- iPhone -->
  <rect x="205" y="106" width="38" height="64" rx="6" fill="white" stroke="#5BA85A" stroke-width="1.2"/>
  <rect x="210" y="114" width="28" height="44" rx="2" fill="#C5E0C4"/>
  <circle cx="224" cy="164" r="3" fill="#5BA85A"/>
  <rect x="216" y="109" width="14" height="2.5" rx="1.2" fill="#5BA85A"/>
  <text x="224" y="190" text-anchor="middle" font-size="9" font-weight="bold" fill="#1A5A1A">iOS</text>
  <text x="224" y="202" text-anchor="middle" font-size="9" fill="#1A5A1A">エンジニア</text>

  <!-- Android area -->
  <rect x="264" y="98" width="64" height="110" rx="7" fill="#F0FAF0" stroke="#5BA85A" stroke-width="1.2" stroke-dasharray="4,2"/>
  <!-- Android phone icon -->
  <rect x="277" y="106" width="38" height="64" rx="6" fill="white" stroke="#5BA85A" stroke-width="1.2"/>
  <rect x="282" y="114" width="28" height="44" rx="2" fill="#C5E0C4"/>
  <circle cx="296" cy="164" r="3" fill="#5BA85A"/>
  <!-- Android antenna ears -->
  <line x1="289" y1="106" x2="285" y2="100" stroke="#5BA85A" stroke-width="1.2"/>
  <line x1="303" y1="106" x2="307" y2="100" stroke="#5BA85A" stroke-width="1.2"/>
  <text x="296" y="190" text-anchor="middle" font-size="9" font-weight="bold" fill="#1A5A1A">Android</text>
  <text x="296" y="202" text-anchor="middle" font-size="9" fill="#1A5A1A">エンジニア</text>

  <text x="260" y="228" text-anchor="middle" font-size="10" fill="#444">ネイティブアプリ</text>
  <text x="260" y="242" text-anchor="middle" font-size="10" fill="#555">（iOSアプリ・Androidアプリ）</text>
  <text x="260" y="258" text-anchor="middle" font-size="10" fill="#555">の中で動く</text>
  <text x="260" y="326" text-anchor="middle" font-size="10" fill="#2C5F8A">スマートフォン</text>

  <!-- ARROWS -->
  <!-- PC/FE -> Server -->
  <line x1="354" y1="185" x2="456" y2="185" stroke="#E07B39" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="456" y1="196" x2="354" y2="196" stroke="#4A90D9" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- Smartphone -> Server -->
  <line x1="354" y1="255" x2="456" y2="255" stroke="#E07B39" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="456" y1="266" x2="354" y2="266" stroke="#4A90D9" stroke-width="1.8" marker-end="url(#a2)"/>

  <text x="405" y="174" text-anchor="middle" font-size="10" fill="#E07B39">リクエスト</text>
  <text x="405" y="213" text-anchor="middle" font-size="10" fill="#4A90D9">レスポンス</text>

  <!-- SERVER SIDE -->
  <rect x="460" y="55" width="340" height="300" rx="14" fill="#EDF6EC" stroke="#5BA85A" stroke-width="2"/>
  <text x="630" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D6B2C">サーバ　（共通）</text>

  <!-- Backend area -->
  <rect x="474" y="90" width="312" height="150" rx="8" fill="#D5EDD4" stroke="#5BA85A" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- App icon -->
  <rect x="488" y="108" width="110" height="55" rx="5" fill="white" stroke="#5BA85A" stroke-width="1.2"/>
  <text x="543" y="127" text-anchor="middle" font-size="10" fill="#2D6B2C">アプリケーション</text>
  <rect x="496" y="133" width="96" height="6" rx="2" fill="#C5E0C4"/>
  <rect x="496" y="143" width="68" height="6" rx="2" fill="#C5E0C4"/>
  <!-- arrow -->
  <line x1="600" y1="135" x2="618" y2="135" stroke="#888" stroke-width="1.4" marker-end="url(#a3)"/>
  <!-- DB icon -->
  <rect x="622" y="108" width="148" height="55" rx="5" fill="white" stroke="#9B59B6" stroke-width="1.2"/>
  <ellipse cx="696" cy="122" rx="36" ry="9" fill="#EDE0F5" stroke="#9B59B6" stroke-width="1.2"/>
  <rect x="660" y="122" width="72" height="26" fill="#EDE0F5" stroke="#9B59B6" stroke-width="1.2"/>
  <ellipse cx="696" cy="148" rx="36" ry="9" fill="#EDE0F5" stroke="#9B59B6" stroke-width="1.2"/>
  <text x="696" y="139" text-anchor="middle" font-size="9" fill="#6C2D8A">DB</text>

  <text x="630" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A5A1A">バックエンド</text>
  <text x="630" y="211" text-anchor="middle" font-size="10" fill="#444">サーバの中で動く</text>
  <text x="630" y="225" text-anchor="middle" font-size="10" fill="#555">データ処理・ロジック</text>

  <!-- Infra area -->
  <rect x="474" y="258" width="312" height="82" rx="8" fill="#FDE8D0" stroke="#E07B39" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="630" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#A0440A">インフラ</text>
  <text x="630" y="295" text-anchor="middle" font-size="10" fill="#555">サーバ全体の土台</text>
  <text x="630" y="328" text-anchor="middle" font-size="10" fill="#888">Web・iOS・Androidいずれも共通して利用</text>

  <!-- BOTTOM NOTE -->
  <rect x="20" y="368" width="780" height="50" rx="10" fill="white" stroke="#CCC" stroke-width="1.2"/>
  <text x="410" y="387" text-anchor="middle" font-size="11" fill="#333">
    スマホの登場で、クライアント側に<tspan font-weight="bold">iOSエンジニア・Androidエンジニア</tspan>という役割が加わった
  </text>
  <text x="410" y="406" text-anchor="middle" font-size="11" fill="#666">
    サーバ側（<tspan font-weight="bold" fill="#1A5A1A">バックエンド・インフラ</tspan>）はWebアプリ・スマホアプリで共通して使われる
  </text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#E07B39"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4A90D9"/>
    </marker>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#888"/>
    </marker>
  </defs>

</svg>
